<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Обычный рабочий день — MaratGame</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button" title="Полный экран" aria-label="Полный экран"></div>
        <div id="unity-build-title">MaratGame</div>
      </div>
    </div>
    <button type="button" id="unity-fullscreen-button-mobile" title="Полный экран" aria-label="Полный экран"></button>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var unityContainer = document.querySelector("#unity-container");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var fullscreenButtonMobile = document.querySelector("#unity-fullscreen-button-mobile");
      var unityInstanceRef = null;
      var isMobileLayout = false;

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      function getFullscreenElement() {
        return document.fullscreenElement
          || document.webkitFullscreenElement
          || document.mozFullScreenElement
          || document.msFullscreenElement
          || null;
      }

      function isGameFullscreen() {
        if (getFullscreenElement())
          return true;
        return unityContainer && unityContainer.classList.contains("unity-pseudo-fullscreen");
      }

      function exitGameFullscreen() {
        if (unityInstanceRef && unityInstanceRef.SetFullscreen)
          unityInstanceRef.SetFullscreen(0);

        var exit = document.exitFullscreen
          || document.webkitExitFullscreen
          || document.mozCancelFullScreen
          || document.msExitFullscreen;
        if (exit)
          exit.call(document).catch(function() {});

        if (unityContainer)
          unityContainer.classList.remove("unity-pseudo-fullscreen");
        document.body.classList.remove("unity-body-fullscreen");
        updateFullscreenUi();
      }

      function enterGameFullscreen() {
        if (unityInstanceRef && unityInstanceRef.SetFullscreen) {
          try {
            unityInstanceRef.SetFullscreen(1);
            updateFullscreenUi();
            return;
          } catch (e) {}
        }

        var target = unityContainer || canvas || document.documentElement;
        var request = target.requestFullscreen
          || target.webkitRequestFullscreen
          || target.webkitRequestFullScreen
          || target.mozRequestFullScreen
          || target.msRequestFullscreen;
        if (request) {
          Promise.resolve(request.call(target)).then(updateFullscreenUi).catch(enterPseudoFullscreen);
          return;
        }

        enterPseudoFullscreen();
      }

      function enterPseudoFullscreen() {
        if (!unityContainer)
          return;
        unityContainer.classList.add("unity-pseudo-fullscreen");
        document.body.classList.add("unity-body-fullscreen");
        window.scrollTo(0, 1);
        updateFullscreenUi();
      }

      function toggleGameFullscreen() {
        if (isGameFullscreen())
          exitGameFullscreen();
        else
          enterGameFullscreen();
      }

      function updateFullscreenUi() {
        var active = isGameFullscreen();
        var label = active ? "Выйти из полного экрана" : "Полный экран";
        if (fullscreenButton) {
          fullscreenButton.title = label;
          fullscreenButton.setAttribute("aria-label", label);
          fullscreenButton.classList.toggle("unity-fullscreen-active", active);
        }
        if (fullscreenButtonMobile) {
          fullscreenButtonMobile.title = label;
          fullscreenButtonMobile.setAttribute("aria-label", label);
          fullscreenButtonMobile.classList.toggle("unity-fullscreen-active", active);
        }
      }

      function bindFullscreenButtons() {
        if (fullscreenButton)
          fullscreenButton.onclick = toggleGameFullscreen;
        if (fullscreenButtonMobile)
          fullscreenButtonMobile.onclick = toggleGameFullscreen;
      }

      document.addEventListener("fullscreenchange", updateFullscreenUi);
      document.addEventListener("webkitfullscreenchange", updateFullscreenUi);

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data",
        frameworkUrl: buildUrl + "/WebGL.framework.js",
        codeUrl: buildUrl + "/WebGL.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "MaratGame",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      isMobileLayout = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      if (isMobileLayout) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover';
        document.getElementsByTagName('head')[0].appendChild(meta);
        unityContainer.className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";
      bindFullscreenButtons();

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          unityInstanceRef = unityInstance;
          document.querySelector("#unity-loading-bar").style.display = "none";
          bindFullscreenButtons();
          updateFullscreenUi();
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
