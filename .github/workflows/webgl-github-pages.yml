# Сборка Unity WebGL → папка docs/ на ветке main (GitHub Pages: main /docs).
# Инструкция: docs/WEB_DEPLOY.md

name: WebGL → GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: webgl-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build WebGL
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare manifest for CI
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path
          for name in ("manifest.json", "packages-lock.json"):
              path = Path("Packages") / name
              data = json.loads(path.read_text(encoding="utf-8"))
              deps = data.get("dependencies", {})
              deps.pop("com.local.unitymcp", None)
              path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      - name: Build project (WebGL)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.7f1
          targetPlatform: WebGL
          buildMethod: MaratGame.Editor.WebGLBuildMenu.BuildForGitHubPages
          buildsPath: build
          buildName: WebGL
          versioning: None
          allowDirtyBuild: true

      - name: Upload WebGL artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebGL
          path: build/WebGL
          retention-days: 3

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download WebGL build
        uses: actions/download-artifact@v4
        with:
          name: WebGL
          path: build/WebGL

      - name: Prepare site root
        run: touch build/WebGL/.nojekyll

      # Билд в docs/ на main — в Pages выбираешь branch main, folder /docs
      - name: Publish WebGL into docs/
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: main
          publish_dir: ./build/WebGL
          destination_dir: docs
          keep_files: true
          commit_message: "Deploy WebGL build to docs/ for GitHub Pages"
